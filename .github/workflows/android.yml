name: Android CI

on:
  push:
    # Only what goes into the APK.
    paths:
      - .github/workflows/android.yml
      - annotation/**
      - app/**
      - authenticatorbridge/**
      - core/**
      - cxf/**
      - data/**
      - network/**
      # The local vault, which is a submodule.
      - local-vault-rs
      - .gitmodules
      - ui/**
      - gradle/**
      - keystores/**
      - "*.gradle.kts"
      - gradle.properties
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # The Bitwarden SDK comes from GitHub Packages, which asks for a token even though the
      # package is public.
      packages: read

    outputs:
      apk-name: ${{ steps.rename.outputs.apk-name }}
      signed: ${{ steps.keystore.outputs.signed }}

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # The local vault is built from the submodule, with the toolchain that it pins, for the ABI
      # that the APK is built for. The runner has the Android NDK, which cargo-ndk finds by
      # ANDROID_NDK_HOME.
      - name: Set up Rust
        working-directory: local-vault-rs
        run: |
          rustup show
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --locked

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: local-vault-rs -> ../network/build/local-vault/cargo

      # A build can only be installed over one that does not have a higher version code.
      - name: Set the version code
        run: |
          set -euo pipefail
          sed -i -E "s/^appVersionCode = \".*\"/appVersionCode = \"$GITHUB_RUN_NUMBER\"/" gradle/libs.versions.toml
          grep -q "^appVersionCode = \"$GITHUB_RUN_NUMBER\"" gradle/libs.versions.toml

      # Shown on the About screen of the app.
      - name: Record the build
        run: |
          bash scripts/update_app_ci_build_info.sh \
            "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"

      - name: Decode signing keystore
        id: keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/signing.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::SIGNING_KEYSTORE_BASE64 is not set; the APK is signed with the debug key of this repository and cannot update a build that was signed with another key."
          fi

      # The fdroid flavor is the one without the Google services, which need a configuration that
      # is not in the repository. Only the arm64-v8a libraries of the Bitwarden SDK are packaged.
      - name: Build release APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -n "${SIGNING_KEYSTORE_PATH:-}" ]; then
            store_file="$SIGNING_KEYSTORE_PATH"
            store_password="$SIGNING_KEYSTORE_PASSWORD"
            key_alias="$SIGNING_KEY_ALIAS"
          else
            store_file="$GITHUB_WORKSPACE/keystores/debug.keystore"
            store_password="android"
            key_alias="androiddebugkey"
          fi
          ./gradlew :app:assembleFdroidRelease \
            -PabiFilters=arm64-v8a \
            -Pandroid.injected.signing.store.file="$store_file" \
            -Pandroid.injected.signing.store.password="$store_password" \
            -Pandroid.injected.signing.key.alias="$key_alias" \
            -Pandroid.injected.signing.key.password="$store_password"

      - name: Rename build outputs
        id: rename
        run: |
          set -euo pipefail
          apk_dir=app/build/outputs/apk/fdroid/release
          mapping_dir=app/build/outputs/mapping/fdroidRelease
          # The name and the versionName the APK was built with, as recorded by the Android Gradle
          # plugin.
          version=$(jq -r '.elements[0].versionName // empty' "$apk_dir/output-metadata.json")
          apk_file=$(jq -r '.elements[0].outputFile // empty' "$apk_dir/output-metadata.json")
          if [ -z "$version" ] || [ -z "$apk_file" ]; then
            echo "::error::versionName or outputFile not found in $apk_dir/output-metadata.json"
            exit 1
          fi
          apk_name="Bitwarden-local-$version-$GITHUB_RUN_NUMBER-arm64"
          mv "$apk_dir/$apk_file" "$apk_dir/$apk_name.apk"
          mv "$mapping_dir/mapping.txt" "$mapping_dir/$apk_name-mapping.txt"
          echo "apk-name=$apk_name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.rename.outputs.apk-name }}
          path: app/build/outputs/apk/fdroid/release/${{ steps.rename.outputs.apk-name }}.apk
          if-no-files-found: error

      # Needed to retrace obfuscated stack traces from this build.
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.rename.outputs.apk-name }}-mapping
          path: app/build/outputs/mapping/fdroidRelease/${{ steps.rename.outputs.apk-name }}-mapping.txt
          if-no-files-found: error

  # The tests of what was changed to keep the vault on the device. The build does not wait for
  # them: they are here to show whether the local vault still does what the app expects of a
  # server, which is not something that can be seen from a build that succeeds.
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # The unit tests run the local vault on the runner, which is built from the submodule.
      - name: Set up Rust
        working-directory: local-vault-rs
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: local-vault-rs -> ../network/build/local-vault/cargo

      - name: Test the local vault
        run: ./gradlew :network:testDebugUnitTest

      - name: Test the changed parts of the app
        run: |
          ./gradlew :app:testStandardDebugUnitTest \
            --tests "com.x8bit.bitwarden.ui.platform.feature.settings.other.*" \
            --tests "com.x8bit.bitwarden.data.platform.manager.network.NetworkConnectionManagerTest" \
            --tests "com.x8bit.bitwarden.data.platform.manager.localvault.*" \
            --tests "com.x8bit.bitwarden.data.platform.datasource.disk.LocalVaultDiskSourceTest"

  # Puts the APK on the Releases page as the "Latest Build" pre-release, so that it can be
  # downloaded without signing in, which workflow artifacts require. An APK signed with the
  # debug key could not update an installed build, so it is not published.
  publish-latest:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && needs.build.outputs.signed == 'true'
    needs: build
    runs-on: ubuntu-latest

    # A run checks that no later run has published before it publishes its own build, which two
    # runs at once could both get past and leave two Latest Builds. Queue them instead.
    concurrency:
      group: publish-latest
      cancel-in-progress: false

    permissions:
      contents: write

    # As whom gh acts and on which repository: there is no checkout here for it to tell from.
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Download the APK
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.apk-name }}
          path: apk

      # Every build gets a release under a tag of its own instead of refreshing a fixed tag, which
      # keeps working if immutable releases are enabled: a published release then cannot have its
      # assets replaced, and a deleted release's tag name can never be used again. Without
      # --target the tag would go on the head of the default branch, which need not be this commit.
      #
      # Runs do not get here in the order they were started: a build can outlast the next one's,
      # and an old run can be run again. Such a run has nothing to publish, since the Latest Build
      # that is up is later than its own. The run number in the tag tells them apart.
      - name: Publish the Latest Build pre-release
        env:
          TAG: ci-${{ github.run_number }}
        run: |
          set -euo pipefail
          later_tags="$(gh release list --limit 100 --json tagName,name,isPrerelease \
            | jq -r --argjson run "$GITHUB_RUN_NUMBER" \
              '.[] | select(.name == "Latest Build" and .isPrerelease) | .tagName
                | select(startswith("ci-")) | select(ltrimstr("ci-") | tonumber > $run)')"
          if [ -n "$later_tags" ]; then
            echo "::notice::A later run has already published its build; not publishing this one."
            exit 0
          fi
          gh release create "$TAG" apk/*.apk \
            --target "$GITHUB_SHA" --prerelease --title "Latest Build" \
            --notes "Built from $GITHUB_SHA by [run $GITHUB_RUN_NUMBER]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."

      # Only once the new release is up, so that there is always one to download. Deleting a
      # release leaves its tag behind, hence --cleanup-tag.
      - name: Delete the Latest Build releases of earlier runs
        run: |
          set -euo pipefail
          old_tags="$(gh release list --limit 100 --json tagName,name,isPrerelease \
            | jq -r --argjson run "$GITHUB_RUN_NUMBER" \
              '.[] | select(.name == "Latest Build" and .isPrerelease) | .tagName
                | select(startswith("ci-")) | select(ltrimstr("ci-") | tonumber < $run)')"
          for old in $old_tags; do
            gh release delete "$old" --yes --cleanup-tag
          done
